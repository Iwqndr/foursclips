<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clip Gallery</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>??</text></svg>">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #fafaf7;
    --bg-pattern: rgba(0, 0, 0, 0.025);
    --card: #ffffff;
    --border: #e5e5e0;
    --border-soft: #ececE6;
    --primary: #a8d8ea;
    --primary-hover: #93cbe1;
    --primary-deep: #7bb8d4;
    --primary-shadow: #8fc4da;
    --accent: #3b7ea1;
    --text: #1a1a1a;
    --text-muted: #6b6b6b;
    --text-soft: #949494;
    --danger: #c94f4f;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 32px rgba(0,0,0,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg);
    background-image:
      linear-gradient(45deg, var(--bg-pattern) 25%, transparent 25%),
      linear-gradient(-45deg, var(--bg-pattern) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--bg-pattern) 75%),
      linear-gradient(-45deg, transparent 75%, var(--bg-pattern) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Header ===== */
  .site-header {
    padding: 48px 24px 32px;
    text-align: center;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 12px;
  }

  .logo-icon {
    width: 54px;
    height: 54px;
    background: var(--primary);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 0 var(--primary-shadow), 0 6px 16px rgba(123, 184, 212, 0.35);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .logo-icon svg {
    width: 30px;
    height: 30px;
    color: white;
    stroke-width: 2.5;
  }

  .logo:hover .logo-icon {
    transform: translateY(-2px) rotate(-4deg);
  }

  .logo-text {
    font-size: 42px;
    font-weight: 800;
    letter-spacing: -1.5px;
    color: var(--text);
  }

  .logo-text span {
    color: var(--accent);
  }

  .tagline {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .tagline a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }

  .tagline a:hover {
    text-decoration: underline;
  }

  /* ===== Search bar ===== */
  .search-wrap {
    max-width: 560px;
    margin: 0 auto 28px;
    padding: 0 20px;
    position: relative;
  }

  .search-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 14px 20px 14px 48px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }

  .search-input::placeholder { color: var(--text-soft); }

  .search-input:focus {
    border-color: var(--primary-deep);
    box-shadow: 0 0 0 4px rgba(168, 216, 234, 0.3);
  }

  .search-icon {
    position: absolute;
    left: 38px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: var(--text-soft);
    pointer-events: none;
  }

  /* ===== Container ===== */
  .container {
    max-width: 1140px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }

  /* ===== Toolbar / filter row ===== */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .filter-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.18s ease;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .filter-pill svg {
    width: 14px;
    height: 14px;
  }

  .filter-pill:hover {
    border-color: var(--primary-deep);
    color: var(--accent);
  }

  .filter-pill.active {
    background: var(--primary);
    border-color: var(--primary-deep);
    color: white;
    box-shadow: 0 2px 0 var(--primary-shadow);
  }

  .filter-pill.active svg { color: white; }

  .clip-count {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 500;
  }

  /* ===== Gallery grid ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.25s ease,
                border-color 0.25s ease;
    cursor: pointer;
    position: relative;
    user-select: none;
    animation: cardIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 3px 0 var(--primary-shadow), 0 12px 28px rgba(123, 184, 212, 0.28);
    border-color: var(--primary);
  }

  .card:active {
    transform: translateY(-2px);
  }

  .thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, #eef6fa 0%, #dceef5 100%);
    overflow: hidden;
  }

  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .card:hover .thumb-wrap img {
    transform: scale(1.05);
  }

  .thumb-wrap.no-thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='4JUdGzvrMFDWrUUwY3toJATSeNwjn54LkCnKBPRzDuhzi5vSepHfUckJNxRL2gjkNrSqtCoRUrEDAgRwsQvVCjZbRyFTLRNyDmT1a1boZVstroke-linejoin='round'><polygon points='23 7 16 12 23 17 23 7'/><rect x='1' y='5' width='15' height='14' rx='2' ry='2'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 48px;
    opacity: 0.5;
  }

  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    backdrop-filter: blur(6px);
    background: rgba(255, 255, 255, 0.92);
    color: var(--accent);
    border: 1px solid rgba(59, 126, 161, 0.15);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .badge svg { width: 11px; height: 11px; }

  .badge.temp {
    background: rgba(255, 240, 220, 0.95);
    color: #a86a1f;
    border-color: rgba(168, 106, 31, 0.2);
  }

  .clip-number {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(255, 255, 255, 0.92);
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    border: 1px solid rgba(0,0,0,0.05);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }

  .card-body {
    padding: 14px 16px 16px;
  }

  .clip-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .clip-link {
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
    display: block;
    padding: 8px 12px;
    background: #f0f7fa;
    border-radius: 8px;
    transition: background 0.15s ease;
    cursor: pointer;
    font-family: "SF Mono", Consolas, monospace;
    border: 1px solid transparent;
  }

  .clip-link:hover {
    background: #e3f0f6;
    border-color: rgba(123, 184, 212, 0.4);
  }

  .clip-meta {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 8px;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .clip-meta svg { width: 12px; height: 12px; }

  /* ===== Context Menu ===== */
  .context-menu {
    position: fixed;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12), 0 2px 0 rgba(0,0,0,0.02);
    padding: 6px;
    min-width: 220px;
    z-index: 1000;
    opacity: 0;
    transform: scale(0.94) translateY(-4px);
    transform-origin: top left;
    pointer-events: none;
    transition: opacity 0.16s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .context-menu.open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  .context-menu button {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: transparent;
    border: none;
    padding: 10px 14px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: background 0.12s ease;
  }

  .context-menu button:hover {
    background: #f0f7fa;
    color: var(--accent);
  }

  .context-menu button:active {
    background: #e3f0f6;
  }

  .context-menu button.danger { color: var(--danger); }
  .context-menu button.danger:hover { background: #fdeeee; color: var(--danger); }

  .context-menu .icon {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    color: var(--text-soft);
  }

  .context-menu button:hover .icon { color: var(--accent); }
  .context-menu button.danger .icon { color: var(--danger); }

  .context-menu .divider {
    height: 1px;
    background: var(--border-soft);
    margin: 4px 8px;
  }

  /* ===== Modal ===== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(20, 30, 40, 0.75);
    backdrop-filter: blur(8px);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }

  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-content {
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    max-width: 1100px;
    width: 100%;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    transform: scale(0.94);
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid var(--border);
  }

  .modal-backdrop.open .modal-content {
    transform: scale(1);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border-soft);
    gap: 16px;
    background: #fafaf7;
  }

  .modal-title-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .modal-icon {
    width: 36px;
    height: 36px;
    background: var(--primary);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 0 var(--primary-shadow);
  }

  .modal-icon svg {
    width: 20px;
    height: 20px;
    color: white;
    stroke-width: 2.5;
  }

  .modal-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .modal-subtitle {
    font-size: 11px;
    color: var(--text-soft);
    margin-top: 1px;
  }

  .modal-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 36px;
    height: 36px;
    border-radius: 10px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-close:hover {
    background: #fdeeee;
    border-color: #f4c5c5;
    color: var(--danger);
    transform: rotate(90deg);
  }

  .modal-close svg { width: 18px; height: 18px; }

  .modal-video-wrap {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 0;
  }

  .modal-video-wrap video {
    max-width: 100%;
    max-height: 78vh;
    width: auto;
    height: auto;
    display: block;
  }

  .modal-footer {
    padding: 14px 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border-soft);
    background: #fafaf7;
  }

  .btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 9px 18px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    font-family: inherit;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    box-shadow: 0 2px 0 var(--primary-shadow);
  }

  .btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 3px 0 var(--primary-shadow), 0 6px 14px rgba(123, 184, 212, 0.3);
  }

  .btn:active {
    transform: translateY(1px);
    box-shadow: 0 0 0 var(--primary-shadow);
  }

  .btn svg { width: 14px; height: 14px; }

  .btn.ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    box-shadow: none;
  }

  .btn.ghost:hover {
    background: white;
    border-color: var(--primary-deep);
    color: var(--accent);
    box-shadow: var(--shadow-sm);
  }

  /* ===== Empty state ===== */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }

  .empty-icon {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    background: var(--primary);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 0 var(--primary-shadow);
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .empty-icon svg {
    width: 40px;
    height: 40px;
    color: white;
    stroke-width: 2;
  }

  .empty h2 {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }

  .empty p {
    font-size: 13px;
    color: var(--text-soft);
  }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--text);
    color: white;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    z-index: 3000;
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.3s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .toast svg { width: 15px; height: 15px; }

  /* ===== Footer ===== */
  .site-footer {
    text-align: center;
    padding: 32px 24px 40px;
    font-size: 12px;
    color: var(--text-soft);
    border-top: 1px solid var(--border-soft);
    margin-top: 40px;
  }

  .site-footer a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }

  .site-footer a:hover { text-decoration: underline; }

  /* ===== Responsive ===== */
  @media (max-width: 600px) {
    .logo-text { font-size: 32px; }
    .logo-icon { width: 46px; height: 46px; border-radius: 14px; }
    .logo-icon svg { width: 24px; height: 24px; }
    .grid { grid-template-columns: 1fr; gap: 14px; }
    .container { padding: 0 16px 48px; }
    .site-header { padding: 32px 16px 24px; }
    .search-wrap { padding: 0 16px; }
    .modal-footer { padding: 12px 16px; }
    .btn { padding: 8px 14px; font-size: 11px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">
    <div class="logo-icon">
      <i data-lucide="clapperboard"></i>
    </div>
    <div class="logo-text">Clip<span>box</span></div>
  </div>
  <p class="tagline">All your clips, one cozy place. <a href="#" id="refreshLink">Refresh</a></p>
</header>

<div class="search-wrap">
  <i data-lucide="search" class="search-icon"></i>
  <input type="text" id="searchInput" class="search-input" placeholder="Search clips by name or link…">
</div>

<main class="container">
  <div class="toolbar">
    <div class="filters">
      <button class="filter-pill active" data-filter="all">
        <i data-lucide="layers"></i> All
      </button>
      <button class="filter-pill" data-filter="permanent">
        <i data-lucide="hard-drive"></i> Permanent
      </button>
      <button class="filter-pill" data-filter="temporary">
        <i data-lucide="clock"></i> Temporary
      </button>
    </div>
    <div class="clip-count" id="clipCount">Loading…</div>
  </div>

  <div class="grid" id="gallery"></div>

  <div class="empty" id="empty" style="display:none;">
    <div class="empty-icon">
      <i data-lucide="package-open"></i>
    </div>
    <h2>No clips here yet</h2>
    <p>Once you upload something, it'll show up right here.</p>
  </div>
</main>

<footer class="site-footer">
  Powered by <a href="https://catbox.moe" target="_blank" rel="noopener">Catbox</a> ·
  Built with care
</footer>

<!-- Context Menu -->
<div class="context-menu" id="ctxMenu">
  <button data-action="view">
    <i data-lucide="play" class="icon"></i> View Clip
  </button>
  <button data-action="copy">
    <i data-lucide="link" class="icon"></i> Copy Clip Link
  </button>
  <button data-action="open">
    <i data-lucide="external-link" class="icon"></i> Open in New Tab
  </button>
  <div class="divider"></div>
  <button data-action="copy-name">
    <i data-lucide="clipboard" class="icon"></i> Copy Clip Name
  </button>
  <button data-action="download">
    <i data-lucide="download" class="icon"></i> Download
  </button>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-icon">
          <i data-lucide="film"></i>
        </div>
        <div style="min-width:0;">
          <div class="modal-title" id="modalTitle">Clip</div>
          <div class="modal-subtitle" id="modalSubtitle"></div>
        </div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">
        <i data-lucide="x"></i>
      </button>
    </div>
    <div class="modal-video-wrap">
      <video id="modalVideo" controls autoplay playsinline></video>
    </div>
    <div class="modal-footer">
      <button class="btn" id="modalCopy">
        <i data-lucide="link"></i> Copy Link
      </button>
      <a class="btn" id="modalOpen" href="#" target="_blank" rel="noopener">
        <i data-lucide="external-link"></i> Open Original
      </a>
      <button class="btn ghost" id="modalDownload">
        <i data-lucide="download"></i> Download
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <i data-lucide="check"></i>
  <span id="toastText">Copied!</span>
</div>

<script>
(() => {
  "use strict";

  // Re-run Lucide after DOM mutations
  function refreshIcons() {
    if (window.lucide && typeof window.lucide.createIcons === "function") {
      window.lucide.createIcons();
    }
  }

  const galleryEl  = document.getElementById("gallery");
  const emptyEl    = document.getElementById("empty");
  const clipCount  = document.getElementById("clipCount");
  const ctxMenu    = document.getElementById("ctxMenu");
  const backdrop   = document.getElementById("modalBackdrop");
  const modalVideo = document.getElementById("modalVideo");
  const modalTitle = document.getElementById("modalTitle");
  const modalSub   = document.getElementById("modalSubtitle");
  const modalCopy  = document.getElementById("modalCopy");
  const modalOpen  = document.getElementById("modalOpen");
  const modalDown  = document.getElementById("modalDownload");
  const modalClose = document.getElementById("modalClose");
  const toastEl    = document.getElementById("toast");
  const toastText  = document.getElementById("toastText");
  const searchInput = document.getElementById("searchInput");
  const refreshLink = document.getElementById("refreshLink");

  let allClips = [];
  let activeClip = null;
  let currentFilter = "all";
  let currentQuery = "";
  let toastTimer = null;

  // ---------- Toast ----------
  function showToast(msg) {
    toastText.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  // ---------- Clipboard ----------
  async function copyText(text, label = "Copied!") {
    try {
      await navigator.clipboard.writeText(text);
      showToast(label);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); showToast(label); }
      catch { showToast("Copy failed"); }
      document.body.removeChild(ta);
    }
  }

  // ---------- Filtering ----------
  function applyFilters() {
    const q = currentQuery.trim().toLowerCase();
    return allClips.filter(clip => {
      // Filter by service
      if (currentFilter === "permanent") {
        if (!/catbox/i.test(clip.service || "")) return false;
      } else if (currentFilter === "temporary") {
        if (!/litter/i.test(clip.service || "")) return false;
      }
      // Filter by search
      if (q) {
        const haystack = `${clip.file_name || ""} ${clip.link || ""}`.toLowerCase();
        if (!haystack.includes(q)) return false;
      }
      return true;
    });
  }

  // ---------- Render ----------
  function renderClips(clips) {
    galleryEl.innerHTML = "";

    if (clips.length === 0) {
      emptyEl.style.display = "block";
      clipCount.textContent = "0 clips";
      return;
    }

    emptyEl.style.display = "none";
    clipCount.textContent = `${clips.length} clip${clips.length === 1 ? "" : "s"}`;

    clips.forEach((clip, i) => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.animationDelay = `${Math.min(i * 30, 500)}ms`;

      const isTemp = /litter/i.test(clip.service || "");
      const badgeLabel = isTemp ? "Temporary" : "Permanent";
      const badgeIcon = isTemp ? "clock" : "hard-drive";

      const thumb = clip.thumbnail_url
        ? `<img src="${clip.thumbnail_url}" alt="" loading="lazy" onerror="this.parentElement.classList.add('no-thumb'); this.remove();">`
        : "";

      card.innerHTML = `
        <div class="thumb-wrap ${clip.thumbnail_url ? "" : "no-thumb"}">
          ${thumb}
          <span class="badge ${isTemp ? "temp" : ""}">
            <i data-lucide="${badgeIcon}"></i> ${badgeLabel}
          </span>
          <span class="clip-number">#${clip.clip_number ?? "?"}</span>
        </div>
        <div class="card-body">
          <div class="clip-name" title="${escapeAttr(clip.file_name)}">${escapeHtml(clip.file_name)}</div>
          <a class="clip-link" href="${escapeAttr(clip.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
            ${escapeHtml(truncate(clip.link, 46))}
          </a>
          <div class="clip-meta">
            <i data-lucide="calendar"></i>
            <span>${formatDate(clip.timestamp)}</span>
          </div>
        </div>
      `;

      card.addEventListener("click", (e) => {
        if (e.target.closest(".clip-link")) return;
        openModal(clip);
      });

      card.addEventListener("contextmenu", (e) => {
        e.preventDefault();
        activeClip = clip;
        openContextMenu(e.clientX, e.clientY);
      });

      galleryEl.appendChild(card);
    });

    refreshIcons();
  }

  // ---------- Context menu ----------
  function openContextMenu(x, y) {
    ctxMenu.style.left = "0px";
    ctxMenu.style.top  = "0px";
    ctxMenu.classList.add("open");

    const rect = ctxMenu.getBoundingClientRect();
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    let posX = x;
    let posY = y;
    if (posX + rect.width  > vw - 8) posX = vw - rect.width  - 8;
    if (posY + rect.height > vh - 8) posY = vh - rect.height - 8;

    ctxMenu.style.left = posX + "px";
    ctxMenu.style.top  = posY + "px";
    ctxMenu.style.transformOrigin = `${x - posX + 8}px ${y - posY + 8}px`;
  }

  function closeContextMenu() {
    ctxMenu.classList.remove("open");
  }

  ctxMenu.addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn || !activeClip) return;
    const action = btn.dataset.action;

    switch (action) {
      case "view":       openModal(activeClip); break;
      case "copy":       await copyText(activeClip.link, "Clip link copied"); break;
      case "open":       window.open(activeClip.link, "_blank", "noopener"); break;
      case "copy-name":  await copyText(activeClip.file_name, "Clip name copied"); break;
      case "download":   triggerDownload(activeClip); break;
    }
    closeContextMenu();
  });

  document.addEventListener("click", (e) => {
    if (!ctxMenu.contains(e.target)) closeContextMenu();
  });
  document.addEventListener("scroll", closeContextMenu, true);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeContextMenu(); closeModal(); }
  });

  // ---------- Modal ----------
  function openModal(clip) {
    activeClip = clip;
    modalTitle.textContent = clip.file_name || "Clip";
    modalSub.textContent = `${clip.service || ""} · Clip #${clip.clip_number ?? "?"}`;
    modalVideo.src = clip.link;
    modalCopy.dataset.link = clip.link;
    modalOpen.href = clip.link;
    modalDown.dataset.link = clip.link;
    backdrop.classList.add("open");
    requestAnimationFrame(() => {
      modalVideo.play().catch(() => {});
    });
  }

  function closeModal() {
    backdrop.classList.remove("open");
    try { modalVideo.pause(); } catch {}
    modalVideo.removeAttribute("src");
    modalVideo.load();
  }

  backdrop.addEventListener("click", closeModal);
  modalClose.addEventListener("click", closeModal);
  modalCopy.addEventListener("click", () => copyText(modalCopy.dataset.link, "Clip link copied"));
  modalDown.addEventListener("click", () => { if (activeClip) triggerDownload(activeClip); });

  function triggerDownload(clip) {
    const a = document.createElement("a");
    a.href = clip.link;
    a.download = clip.file_name || "clip.mp4";
    a.target = "_blank";
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast("Download started");
  }

  // ---------- Helpers ----------
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }
  function truncate(s, n) {
    s = String(s ?? "");
    return s.length > n ? s.slice(0, n - 1) + "…" : s;
  }
  function formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    } catch { return ""; }
  }

  // ---------- Filter pills ----------
  document.querySelectorAll(".filter-pill").forEach(pill => {
    pill.addEventListener("click", () => {
      document.querySelectorAll(".filter-pill").forEach(p => p.classList.remove("active"));
      pill.classList.add("active");
      currentFilter = pill.dataset.filter;
      renderClips(applyFilters());
    });
  });

  // ---------- Search ----------
  let searchTimer = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      currentQuery = searchInput.value;
      renderClips(applyFilters());
    }, 120);
  });

  // ---------- Refresh ----------
  refreshLink.addEventListener("click", (e) => {
    e.preventDefault();
    loadClips();
    showToast("Refreshed");
  });

  // ---------- Load data ----------
  async function loadClips() {
    try {
      const res = await fetch("clips.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      allClips = Array.isArray(data) ? data : [];
      renderClips(applyFilters());
    } catch (err) {
      console.error("Failed to load clips.json:", err);
      galleryEl.innerHTML = "";
      emptyEl.style.display = "block";
      emptyEl.querySelector("h2").textContent = "Couldn't load clips";
      emptyEl.querySelector("p").textContent = "Make sure clips.json exists next to index.html.";
      clipCount.textContent = "offline";
    }
  }

  // Initial icon render (static icons in header/menu/modal)
  refreshIcons();

  loadClips();
  setInterval(loadClips, 60_000);
})();
</script>
</body>
</html>
